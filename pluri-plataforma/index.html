<head>

    <link rel="stylesheet" href="css/style.css">
    <style>
    /* Botão flutuante de feedback */
    .feedback-fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    height: 52px;
    padding: 0 20px 0 16px;
    border-radius: 26px;
    background: #002C47;
    color: #fff;
    border: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 500;
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
}
.feedback-fab:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.3);
}
.feedback-fab svg {
    width: 20px;
    height: 20px;
}

    /* Modal de feedback */
    /* Modal de feedback */
.feedback-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 600;
    display: none;
    align-items: center;
    justify-content: center;
}
.feedback-modal-overlay.show {
    display: flex;
}
.feedback-modal {
    position: relative;
    background: #fff;
    border-radius: 14px;
    width: 90%;
    max-width: 640px;
    height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.feedback-modal iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 0 0 14px 14px;
}
.feedback-close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    background: #f0f3f7;
    border: 1px solid #ddd;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    color: #333;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
}
.feedback-close-btn:hover {
    background: #e0e4e8;
}
</style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,450;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <script src="js/app.js"></script>
    <script>
        // Garantia absoluta de funcionamento do menu mobile
        (function() {
            function toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar) sidebar.classList.toggle('open');
                if (overlay) overlay.classList.toggle('show');
            }
            function closeSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar) sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('show');
            }
            // Registrar listeners imediatamente após a definição
            document.addEventListener('DOMContentLoaded', function() {
                const hamburger = document.getElementById('hamburgerBtn');
                const overlay = document.getElementById('sidebarOverlay');
                if (hamburger) hamburger.addEventListener('click', toggleSidebar);
                if (overlay) overlay.addEventListener('click', closeSidebar);
                // Expor globalmente para qualquer outro uso
                window.toggleSidebar = toggleSidebar;
                window.closeSidebar = closeSidebar;
            });
            // Se o DOM já estiver pronto, executa imediatamente
            if (document.readyState !== 'loading') {
                const hamburger = document.getElementById('hamburgerBtn');
                const overlay = document.getElementById('sidebarOverlay');
                if (hamburger) hamburger.addEventListener('click', toggleSidebar);
                if (overlay) overlay.addEventListener('click', closeSidebar);
                window.toggleSidebar = toggleSidebar;
                window.closeSidebar = closeSidebar;
            }
        })();

        (function() {
            function tryCreateIcons() {
                if (window.lucide && typeof lucide.createIcons === 'function') {
                    lucide.createIcons();
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', tryCreateIcons);
            } else {
                tryCreateIcons();
            }
        })();
    </script>
