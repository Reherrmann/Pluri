<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLURI OS</title>
    <base href="/pluri-plataforma/">
    <link rel="stylesheet" href="css/style.css">
    <style>
    /* Botão flutuante de feedback */
    .feedback-fab {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #002C47; /* cor primária */
        color: #fff;
        border: none;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 500;
        transition: transform 0.2s;
    }
    .feedback-fab:hover {
        transform: scale(1.1);
    }
    .feedback-fab svg {
        width: 24px;
        height: 24px;
    }

    /* Modal de feedback */
    .feedback-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 600;
        display: none;
        align-items: center;
        justify-content: center;
    }
    .feedback-modal-overlay.show {
        display: flex;
    }
    .feedback-modal {
        background: #fff;
        border: 2px solid #ddd;
        border-radius: 14px;
        width: 90%;
        max-width: 480px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        padding: 24px;
        max-height: 90vh;
        overflow-y: auto;
    }
    .feedback-modal h3 {
        margin-bottom: 16px;
        font-size: 18px;
        color: #101828;
    }
    .feedback-modal .form-group {
        margin-bottom: 14px;
    }
    .feedback-modal .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #5b6a7e;
        margin-bottom: 5px;
    }
    .feedback-modal .form-group input,
    .feedback-modal .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        background: #fff;
        color: #101828;
        outline: none;
    }
    .feedback-modal .form-group input:focus,
    .feedback-modal .form-group textarea:focus {
        border-color: #002C47;
    }
    .feedback-modal .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
    }
</style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,450;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
       <div class="sidebar-logo">

    <img
        src="../PLURI-azul.png"
        alt="PLURI"
        class="logo-img"
        width="32"
        height="32"
    >

    <span class="logo-text">PLURI</span>

</div>
        <nav class="sidebar-nav">
            <a data-page="dashboard" class="active"><i data-lucide="layout-dashboard"></i><span>Visão Geral</span></a>
            <a data-page="agenda"><i data-lucide="calendar"></i><span>Agenda</span></a>
            <a data-page="atendimentos"><i data-lucide="message-square"></i><span>Conversas</span></a>
            <a data-page="pacientes"><i data-lucide="users"></i><span>Pacientes</span></a>
           <!-- <a data-page="automacoes"><i data-lucide="zap"></i><span>Automações</span></a> -->
            <a data-page="indicadores"><i data-lucide="bar-chart-3"></i><span>Indicadores</span></a>
            <a data-page="configuracoes"><i data-lucide="settings"></i><span>Configurações</span></a>
        </nav>
        <div class="sidebar-bottom">
            <div class="sidebar-user">
                
                <div class="user-info">
                    <div class="user-name">Recepção</div>
                    <div class="user-role">Atendimento</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">

        id="newPatientFromAppointment"

                <div class="form-group"><label>Telefone</label><input type="text" id="apptPhone" placeholder="(11) 9...."></div>
                <div class="form-row">

                    <div class="form-group"><label>Horário</label><input type="time" id="apptTime"></div>
                </div>
                <div class="form-group"><label>Status</label><select id="apptStatus"><option value="Aguardando">Aguardando</option><option value="Confirmado">Confirmado</option><option value="Cancelado">Cancelado</option></select></div>
                <div class="form-group"><label>Observações</label><textarea id="apptNotes" rows="2"></textarea></div>

<div id="editActions" style="display:none; margin-top:1rem; gap:0.5rem;">
  <button type="button" id="btnConfirmarPresenca" class="btn btn-outline-success">
    <i class="bi bi-whatsapp"></i> Pedir confirmação
  </button>
  <button type="button" id="btnCancelarAgendamento" class="btn btn-outline-danger">
    <i class="bi bi-whatsapp"></i> Comunicar cancelamento
  </button>
</div>
                
            </div>
            <div class="modal-footer">
                
                <button class="btn btn-outline" id="modalCancel">Cancelar</button>
                <button class="btn btn-primary" id="modalSave">Salvar agendamento</button>
                
            </div>
        </div>

    <!-- Slide Panel -->
    <div class="slide-panel-overlay" id="slideOverlay"></div>
    <div class="slide-panel" id="slidePanel">
        <div class="slide-panel-content" id="slideContent"></div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
    <script>
        // Garantia absoluta de funcionamento do menu mobile
        (function() {
            function toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar) sidebar.classList.toggle('open');
                if (overlay) overlay.classList.toggle('show');
            }
            function closeSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar) sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('show');
            }
            // Registrar listeners imediatamente após a definição
            document.addEventListener('DOMContentLoaded', function() {
                const hamburger = document.getElementById('hamburgerBtn');
                const overlay = document.getElementById('sidebarOverlay');
                if (hamburger) hamburger.addEventListener('click', toggleSidebar);
                if (overlay) overlay.addEventListener('click', closeSidebar);
                // Expor globalmente para qualquer outro uso
                window.toggleSidebar = toggleSidebar;
                window.closeSidebar = closeSidebar;
            });
            // Se o DOM já estiver pronto, executa imediatamente
            if (document.readyState !== 'loading') {
                const hamburger = document.getElementById('hamburgerBtn');
                const overlay = document.getElementById('sidebarOverlay');
                if (hamburger) hamburger.addEventListener('click', toggleSidebar);
                if (overlay) overlay.addEventListener('click', closeSidebar);
                window.toggleSidebar = toggleSidebar;
                window.closeSidebar = closeSidebar;
            }
        })();

        (function() {
            function tryCreateIcons() {
                if (window.lucide && typeof lucide.createIcons === 'function') {
                    lucide.createIcons();
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', tryCreateIcons);
            } else {
                tryCreateIcons();
            }
        })();
    </script>

    <!-- Botão flutuante de feedback -->
<button class="feedback-fab" id="feedbackFab" title="Deixe seu comentário">
    <i data-lucide="message-circle"></i>
</button>

<!-- Modal de feedback -->
<div class="feedback-modal-overlay" id="feedbackModalOverlay">
    <div class="feedback-modal">
        <h3>💬 Deixe seu comentário</h3>
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">
            Sua opinião é muito importante para melhorar a plataforma.
        </p>
        <form id="feedbackForm">
            <div class="form-group">
                <label>Seu nome</label>
                <input type="text" name="nome" id="feedbackName" placeholder="Como podemos te chamar?">
            </div>
            <div class="form-group">
                <label>Seu e-mail</label>
                <input type="email" name="email" id="feedbackEmail" placeholder="Para podermos responder (opcional)">
            </div>
            <div class="form-group">
                <label>O que achou da plataforma?</label>
                <textarea name="comentario" id="feedbackMessage" rows="4" placeholder="Conte sua experiência, sugestões ou problemas..."></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-outline" id="feedbackCancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">Enviar comentário</button>
            </div>
        </form>
    </div>
</div>
