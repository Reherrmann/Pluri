name: PLURI patient grid fix
"on":
  push:
    paths:
      - '.github/workflows/mobile-grid-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile grid fix
        run: |
          cat >> pluri-os/css/style.css <<'EOF'

/* PLURI OS - mobile patient data two columns */
@media (max-width: 768px) {
  .patient-info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 1rem !important; width: 100% !important; }
  .patient-info-item { min-width: 0 !important; }
  .patient-info-item.full-width { grid-column: 1 / -1 !important; }
}
@media (max-width: 420px) {
  .patient-info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: .8rem !important; }
}
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pluri-os/css/style.css
          git commit -m 'Fix mobile patient data two-column layout' || exit 0
          git push
