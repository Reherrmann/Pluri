name: PLURI mobile menu fix

on:
  push:

permissions:
  contents: write

jobs:
  fix-mobile-menu:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ajustar menu da ficha do paciente no mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('pluri-os/css/style.css')
          text = path.read_text(encoding='utf-8')

          replacement = '''/* PLURI OS — menu da ficha do paciente no mobile */
          @media (max-width: 768px) {
              .patient-profile-nav ul {
                  display: grid !important;
                  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                  gap: 8px !important;
                  width: 100% !important;
                  padding: 6px !important;
                  overflow: visible !important;
                  white-space: normal !important;
                  border-radius: 10px !important;
              }

              .patient-profile-nav li {
                  width: 100% !important;
                  min-width: 0 !important;
                  flex: none !important;
                  display: flex !important;
                  align-items: center !important;
                  justify-content: center !important;
                  min-height: 42px !important;
                  padding: 8px 10px !important;
                  border: 1px solid var(--border-light) !important;
                  border-left: 1px solid var(--border-light) !important;
                  border-radius: 9px !important;
                  text-align: center !important;
                  white-space: normal !important;
                  line-height: 1.2 !important;
                  font-size: 12.5px !important;
              }

              .patient-profile-nav li.active {
                  background: var(--primary) !important;
                  color: var(--white) !important;
                  border-color: var(--primary) !important;
                  border-left: 1px solid var(--primary) !important;
                  font-weight: 600 !important;
              }
          }

          @media (max-width: 420px) {
              .patient-profile-nav ul {
                  gap: 6px !important;
                  padding: 5px !important;
              }

              .patient-profile-nav li {
                  min-height: 40px !important;
                  padding: 7px 8px !important;
                  font-size: 11.5px !important;
              }
          }
          '''

          # Remove the previous PLURI OS mobile menu override, if present.
          text = re.sub(
              r'/\* PLURI OS — ajuste mobile da ficha do paciente \*/.*$',
              '',
              text,
              flags=re.S,
          ).rstrip() + '\n\n'

          path.write_text(text + replacement, encoding='utf-8')
          PY

      - name: Commitar alteração e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluri-os/css/style.css
          git rm .github/workflows/mobile-menu-fix.yml
          git commit -m "Corrige menu da ficha do paciente no mobile"
          git push
