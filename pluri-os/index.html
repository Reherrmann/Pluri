<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
    // ==========================================
    // PROTEÇÃO DE ACESSO — PLURI OS
    // ==========================================

    const PLURI_AUTH_API =
        'https://script.google.com/macros/s/AKfycbzYGzXwZ4QIwGkBK9TUmTsvhmtpGtA4Wrfu1ifW9lspm1G1YiEoAOFVSnuLKinyOT7kgg/exec';


    (async function () {

        const sessionRaw =
            localStorage.getItem('pluri_session');


        // Sem sessão no navegador
        if (!sessionRaw) {
            window.location.replace('login.html');
            return;
        }


        try {

            const session =
                JSON.parse(sessionRaw);


            // Sessão local incompleta
            if (
                !session ||
                !session.token ||
                !session.user ||
                !session.user.id
            ) {
                localStorage.removeItem('pluri_session');
                window.location.replace('login.html');
                return;
            }


            // Verifica também a validade local
            if (session.expiraEm) {

                const expiration =
                    new Date(session.expiraEm).getTime();

                if (
                    !Number.isFinite(expiration) ||
                    expiration <= Date.now()
                ) {
                    localStorage.removeItem('pluri_session');
                    window.location.replace('login.html');
                    return;
                }
            }


            // ==========================================
            // VALIDA A SESSÃO NO BACKEND DA PLURI
            // ==========================================

            const params =
                new URLSearchParams({
                    action: 'validateSession',
                    token: session.token
                });


            const response =
                await fetch(
                    `${PLURI_AUTH_API}?${params.toString()}`
                );


            if (!response.ok) {
                throw new Error(
                    'Não foi possível validar a sessão.'
                );
            }


            const validation =
                await response.json();


            if (!validation.valid) {

                localStorage.removeItem('pluri_session');

                window.location.replace('login.html');

                return;
            }


            /*
             * Segurança adicional:
             * o ClinicaID do token precisa ser o mesmo
             * ClinicaID recebido no login.
             */
            if (
                String(validation.clinicaId) !==
                String(session.user.clinicaId)
            ) {

                localStorage.removeItem('pluri_session');

                window.location.replace('login.html');

                return;
            }


            // Sessão validada pelo servidor
            window.PLURI_SESSION = session;
            window.PLURI_USER = session.user;
            window.PLURI_SESSION_VALIDATED = true;


        } catch (error) {

            console.error(
                'Erro ao validar sessão PLURI:',
                error
            );

            localStorage.removeItem('pluri_session');

            window.location.replace('login.html');

        }

    })();
</script>

    <!-- Inicialização dos ícones Lucide -->
    <script>
        (function() {
            function tryCreateIcons() {
                if (window.lucide && typeof lucide.createIcons === 'function') {
                    lucide.createIcons();
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', tryCreateIcons);
            } else {
                tryCreateIcons();
            }
        })();

        // Garantir que o menu hamburguer funcione
        (function() {
            function toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar) sidebar.classList.toggle('open');
                if (overlay) overlay.classList.toggle('show');
            }
            function closeSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar) sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('show');
            }
            document.addEventListener('DOMContentLoaded', function() {
                const hamburger = document.getElementById('hamburgerBtn');
                const overlay = document.getElementById('sidebarOverlay');
                if (hamburger) hamburger.addEventListener('click', toggleSidebar);
                if (overlay) overlay.addEventListener('click', closeSidebar);
                window.toggleSidebar = toggleSidebar;
                window.closeSidebar = closeSidebar;
            });
            if (document.readyState !== 'loading') {
                const hamburger = document.getElementById('hamburgerBtn');
                const overlay = document.getElementById('sidebarOverlay');
                if (hamburger) hamburger.addEventListener('click', toggleSidebar);
                if (overlay) overlay.addEventListener('click', closeSidebar);
                window.toggleSidebar = toggleSidebar;
                window.closeSidebar = closeSidebar;
            }
        })();
    </script>
   <script>
    document.addEventListener('DOMContentLoaded', function () {

        // ==========================================
        // USUÁRIO LOGADO — PLURI OS
        // ==========================================

        const sessionRaw = localStorage.getItem('pluri_session');

        if (sessionRaw) {
            try {
                const session = JSON.parse(sessionRaw);
                const user = session.user;

                if (user) {

                    const nameEl =
                        document.getElementById('sidebarUserName');

                    const roleEl =
                        document.getElementById('sidebarUserRole');

                    const avatarEl =
                        document.getElementById('sidebarUserAvatar');

                    const clinicEl =
                        document.getElementById('currentClinicName');


                    // Nome do usuário
                    if (nameEl) {
                        nameEl.textContent =
                            user.nome || 'Usuário';
                    }


                    // Perfil do usuário
                    if (roleEl) {
                        roleEl.textContent =
                            user.perfil || 'Usuário';
                    }


                    // Nome da clínica
                    if (clinicEl) {
                        clinicEl.textContent =
                            user.clinica || 'Clínica';
                    }


                    // Iniciais do usuário
                    if (avatarEl) {

                        const nome =
                            String(user.nome || 'U').trim();

                        const partes =
                            nome.split(/\s+/);

                        let iniciais =
                            partes[0]?.charAt(0) || 'U';

                        if (partes.length > 1) {
                            iniciais +=
                                partes[partes.length - 1].charAt(0);
                        }

                        avatarEl.textContent =
                            iniciais.toUpperCase();
                    }
                }

            } catch (error) {
                console.error(
                    'Erro ao carregar usuário da sessão:',
                    error
                );
            }
        }


        // ==========================================
        // LOGOUT — PLURI OS
        // ==========================================

        const logoutBtn =
            document.getElementById('logoutBtn');

        if (!logoutBtn) return;

        logoutBtn.addEventListener('click', async function () {

    const sessionRaw =
        localStorage.getItem('pluri_session');

    try {

        if (sessionRaw) {

            const session =
                JSON.parse(sessionRaw);

            if (session && session.token) {

                const params =
                    new URLSearchParams({
                        action: 'logout',
                        token: session.token
                    });

                await fetch(
                    `${PLURI_AUTH_API}?${params.toString()}`
                );
            }
        }

    } catch (error) {

        console.warn(
            'Não foi possível encerrar a sessão no servidor:',
            error
        );

    } finally {

        // Remove a sessão do navegador independentemente
        // da resposta do servidor.
        localStorage.removeItem('pluri_session');

        window.PLURI_SESSION = null;
        window.PLURI_USER = null;
        window.PLURI_SESSION_VALIDATED = false;

        window.location.replace('login.html');
    }

});

    });
</script>
