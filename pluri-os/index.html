<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    const PLURI_AUTH_API = 'https://script.google.com/macros/s/AKfycbzYGzXwZ4QIwGkBK9TUmTsvhmtpGtA4Wrfu1ifW9lspm1G1YiEoAOFVSnuLKinyOT7kgg/exec';
    (async function () {
        const sessionRaw = localStorage.getItem('pluri_session');
        if (!sessionRaw) { window.location.replace('/pluri-os/login.html'); return; }
        try {
            const session = JSON.parse(sessionRaw);
            if (!session || !session.token || !session.user || !session.user.id) { localStorage.removeItem('pluri_session'); window.location.replace('/pluri-os/login.html'); return; }
            if (session.expiraEm) {
                const expiration = new Date(session.expiraEm).getTime();
                if (!Number.isFinite(expiration) || expiration <= Date.now()) { localStorage.removeItem('pluri_session'); window.location.replace('/pluri-os/login.html'); return; }
            }
            const params = new URLSearchParams({ action: 'validateSession', token: session.token });
            const response = await fetch(`${PLURI_AUTH_API}?${params.toString()}`);
            if (!response.ok) throw new Error('Não foi possível validar a sessão.');
            const validation = await response.json();
            if (!validation.valid || String(validation.clinicaId) !== String(session.user.clinicaId)) { localStorage.removeItem('pluri_session'); window.location.replace('/pluri-os/login.html'); return; }
            window.PLURI_SESSION = session; window.PLURI_USER = session.user; window.PLURI_SESSION_VALIDATED = true;
        } catch (error) { console.error('Erro ao validar sessão PLURI:', error); localStorage.removeItem('pluri_session'); window.location.replace('/pluri-os/login.html'); }
    })();
    </script>
    <title>PLURI OS</title>
    <link rel="icon" href="../PLURI-azul.png">
    <base href="/pluri-os/">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,450;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><img src="../PLURI-azul.png" alt="PLURI" class="logo-img" width="32" height="32"><span class="logo-text">PLURI</span></div>
        <nav class="sidebar-nav"><a data-page="dashboard" class="active"><i data-lucide="layout-dashboard"></i><span>Visão Geral</span></a><a data-page="agenda"><i data-lucide="calendar"></i><span>Agenda</span></a><a data-page="atendimentos"><i data-lucide="message-square"></i><span>Conversas</span></a><a data-page="pacientes"><i data-lucide="users"></i><span>Pacientes</span></a><a data-page="indicadores"><i data-lucide="bar-chart-3"></i><span>Indicadores</span></a><a data-page="configuracoes"><i data-lucide="settings"></i><span>Configurações</span></a></nav>
        <div class="sidebar-user"><div class="avatar-sm" id="sidebarUserAvatar">--</div><div class="user-info"><div class="user-header"><div class="user-name" id="sidebarUserName">Usuário</div><button type="button" class="sidebar-logout" id="logoutBtn" title="Sair da PLURI"><i data-lucide="log-out"></i>Sair</button></div><div class="user-role"><span id="sidebarUserRole">Perfil</span></div></div></div>
    </aside>
    <main class="main-content"><header class="topbar"><button class="hamburger" id="hamburgerBtn"><i data-lucide="menu" style="pointer-events:none;"></i></button><div class="topbar-left"><h1 class="page-title" id="pageTitle">Bom dia!</h1><p class="page-subtitle" id="pageSubtitle">Acompanhe a agenda, os atendimentos e a rotina da clínica.</p></div><div class="topbar-right"><button class="btn-icon" id="themeToggle" title="Alternar tema"><i data-lucide="sun"></i></button><div class="clinic-badge"><span id="currentClinicName">Clínica</span></div></div></header><div class="page-container" id="pageContainer"><p style="padding:40px;text-align:center;color:#667085;">Carregando…</p></div></main>
    <div class="modal-overlay" id="modalOverlay"><div class="modal"><div class="modal-header"><h3>Novo agendamento</h3><button class="modal-close" id="modalClose"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="form-group"><label>Paciente</label><div style="position:relative;"><input type="text" id="apptPatient" placeholder="Buscar paciente..." autocomplete="off"><div id="patientSearchResults" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:1000;background:var(--card-bg,#fff);border:1px solid var(--border-color,#ddd);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);max-height:240px;overflow-y:auto;"></div></div><button type="button" class="btn btn-outline btn-sm" id="newPatientFromAppointment" style="margin-top:8px;width:100%;"><i data-lucide="user-plus" style="width:16px;height:16px;"></i>Cadastrar novo paciente</button></div><div class="form-group"><label>Telefone</label><input type="text" id="apptPhone" placeholder="(11) 9...."></div><div class="form-row"><div class="form-group"><label>Profissional</label><select id="apptProfessional"><option>Dra. Ana</option><option>Dr. Carlos</option><option>Dra. Fernanda</option></select></div><div class="form-group"><label>Serviço</label><select id="apptService"><option>Avaliação</option><option>Retorno</option><option>Procedimento</option></select></div></div><div class="form-row"><div class="form-group"><label>Data</label><input type="date" id="apptDate"></div><div class="form-group"><label>Horário</label><input type="time" id="apptTime"></div></div><div class="form-group"><label>Status</label><select id="apptStatus"><option value="Aguardando">Aguardando</option><option value="Confirmado">Confirmado</option><option value="Cancelado">Cancelado</option></select></div><div class="form-group"><label>Observações</label><textarea id="apptNotes" rows="2"></textarea></div></div><div class="modal-footer"><button class="btn btn-outline" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">Salvar agendamento</button></div></div></div>
    <div class="modal-overlay" id="prontuarioModal" style="display:none;"><div class="modal"><div class="modal-header"><h3 id="prontuarioModalTitle">Novo registro</h3><button class="modal-close" id="prontuarioModalClose"><i data-lucide="x"></i></button></div><div class="modal-body" id="prontuarioContent"></div><div class="modal-footer"><button class="btn btn-outline" id="prontuarioModalCancel">Cancelar</button><button class="btn btn-primary" id="prontuarioModalSave">Salvar</button></div></div></div>
    <div class="slide-panel-overlay" id="slideOverlay"></div><div class="slide-panel" id="slidePanel"><div class="slide-panel-content" id="slideContent"></div></div>
    <div class="global-loading" id="globalLoading"><div class="global-loading-box"><div class="loading-spinner"></div><div class="global-loading-text" id="globalLoadingText">Carregando...</div></div></div><div class="toast-container" id="toastContainer"></div>
    <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/state.js"></script><script src="js/theme.js"></script><script src="js/navigation.js"></script><script src="js/modal.js"></script><script src="js/slidepanel.js"></script><script src="js/dashboard.js"></script><script src="js/agenda.js"></script><script src="js/atendimentos.js"></script><script src="js/pacientes.js"></script><script src="js/documentos.js"></script><script src="js/automacoes.js"></script><script src="js/indicadores.js"></script><script src="js/configuracoes.js"></script><script src="js/convenios-ficha-paciente.js?v=1"></script><script src="js/app.js"></script>
    <script>(function(){function tryCreateIcons(){if(window.lucide&&typeof lucide.createIcons==='function')lucide.createIcons();}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tryCreateIcons);else tryCreateIcons();})();(function(){function toggleSidebar(){const s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay');if(s)s.classList.toggle('open');if(o)o.classList.toggle('show');}function closeSidebar(){const s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay');if(s)s.classList.remove('open');if(o)o.classList.remove('show');}document.addEventListener('DOMContentLoaded',function(){const h=document.getElementById('hamburgerBtn'),o=document.getElementById('sidebarOverlay');if(h)h.addEventListener('click',toggleSidebar);if(o)o.addEventListener('click',closeSidebar);window.toggleSidebar=toggleSidebar;window.closeSidebar=closeSidebar;})();})();</script>
</body></html>
